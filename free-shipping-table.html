<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Shipping Experiment Results</title>
</head>
<body style="margin: 0; padding: 24px; font-family: Arial, sans-serif; background-color: #f5f9fb;">

<div style="max-width: 720px; margin: 0 auto;">
  <table style="width: 100%; border-collapse: collapse; font-size: 10.5pt; color: #1E556E;">
    <thead>
      <tr>
        <th style="padding: 12px 16px; background: #297496; color: #fff; text-align: left; font-weight: bold; border: 1px solid #C4E4ED; width: 34%;"></th>
        <th style="padding: 12px 16px; background: #297496; color: #fff; text-align: left; font-weight: bold; border: 1px solid #C4E4ED;">Control Group</th>
        <th style="padding: 12px 16px; background: #297496; color: #fff; text-align: left; font-weight: bold; border: 1px solid #C4E4ED;">Treatment Group</th>
      </tr>
    </thead>
    <tbody>
      <tr style="background: #fff;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">Shipping condition</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">$5 shipping</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">Free shipping</td>
      </tr>
      <tr style="background: #f5f9fb;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">Customers</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">1,000</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">1,000</td>
      </tr>
      <tr style="background: #fff;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">Completed purchases</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">180</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">216</td>
      </tr>
      <tr style="background: #f5f9fb;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">Conversion rate</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">18%</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">21.6%</td>
      </tr>
      <tr style="background: #fff;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">Average order value</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">$45</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">$45</td>
      </tr>
      <tr style="background: #f5f9fb;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">Shipping cost per order</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">$0</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;">$5</td>
      </tr>
      <tr style="background: #fff;">
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED; font-weight: bold;">P-value</td>
        <td style="padding: 12px 16px; border: 1px solid #C4E4ED;" colspan="2">0.03 (applies to the overall test)</td>
      </tr>
    </tbody>
  </table>
</div>

<div id="dpCustomCss" data-external-style="/css/style.css">&nbsp;</div>

</html>
